<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Details — Tradar</title>
  <link rel="stylesheet" href="../styles/constant.css">
  <link rel="stylesheet" href="../styles/stock-details.css">
  <link rel="icon" href="https://fav.mhciael.com/📈">
  <script>!function () { try { var u = localStorage.getItem("team08_currentUser"); if (u) { var d = localStorage.getItem("team08_user_" + u); if (d && JSON.parse(d).settings.darkMode === false) document.documentElement.classList.add("light-mode") } } catch (e) { } }();</script>
</head>

<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="nav-logo">Tradar</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="watchlist.html">Watchlist</a></li>
        <li><a href="explore.html">Explore</a></li>
      </ul>
      <div class="nav-right">
        <div class="search-wrapper">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="search" placeholder="Search ticker or company…" name="q" id="search">
        </div>
        <span id="market-status" class="market-status-slot" aria-live="polite"></span>
        <a href="preferences.html" class="pfp-btn" aria-label="Profile">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" x="0px" y="0px" id="pfp">
            <title>Profile</title>
            <path
              d="M59,32C57.52-3.81,6.48-3.81,5,32a27,27,0,0,0,54,0ZM32,6.93c21.5-.08,33,25.81,18.78,41.65C43.84,29,20.15,29,13.22,48.58-1,32.74,10.5,6.85,32,6.93ZM14.73,50.15c6-19.07,28.53-19.07,34.54,0C40,59.31,24,59.31,14.73,50.15Z" />
            <path
              d="M32,30.43a9.85,9.85,0,0,0,9.84-9.84c-.54-13.06-19.14-13-19.68,0A9.85,9.85,0,0,0,32,30.43Zm0-17.75a7.92,7.92,0,0,1,7.91,7.91c-.4,10.48-15.42,10.48-15.82,0A7.92,7.92,0,0,1,32,12.68Z" />
          </svg>
        </a>
      </div>
    </nav>
  </header>

  <div id="search-results"></div>

  <main id="stock-main">
    <div id="stock-layout">

      <!-- ── LEFT COLUMN ──────────────────────────────────────── -->
      <div id="stock-left">

        <!-- Hero -->
        <div id="stock-hero">
          <div id="stock-hero-inner">
            <div id="stock-identity">
              <div id="stock-identity-row">
                <img id="stock-logo" src="" alt="" hidden>
                <h1 id="stock-symbol"></h1>
                <p id="stock-name"></p>
                <p id="stock-industry"></p>
              </div>
              <div id="stock-price-block">
                <span class="price-locator" id="stock-price" data-denomination="USD" data-locale="en-US"
                  data-style="currency" data-spacing="0" data-amount="0" data-setAmount="0"
                  data-denomination-symbol="$"></span>
                <span class="movement-locator" id="stock-change">
                  <span id="direction-locator"></span><span class="price-locator" data-denomination="USD"
                    data-locale="en-US" data-style="currency" data-spacing="0" data-amount="0" data-setAmount="0"
                    data-denomination-symbol="$"></span><span class="percent-change-locator" data-change="0"></span>
                </span>
              </div>
            </div>
            <div id="stock-hero-right">
              <div id="stock-actions">
                <button id="btn-buy" class="btn btn-primary">Buy</button>
<button id="btn-sell" class="btn btn-ghost">Sell</button>
                <button id="btn-watchlist" class="btn btn-ghost">Watch</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Stats + Peers -->
        <div id="stock-body">

          <!-- Stats Panel -->
          <div id="stock-stats-panel" class="sd-panel">
            <div class="sd-panel-header">
              <span class="sd-panel-title">Today's Stats</span>
            </div>
            <div id="stock-stats">
              <div class="stat-item">
                <span class="stat-label">Open</span>
                <span id="stat-open" class="stat-value price-locator" data-denomination="USD" data-locale="en-US"
                  data-style="currency" data-spacing="0" data-amount="0" data-setAmount="0"
                  data-denomination-symbol="$"></span>
              </div>
              <div class="stat-item">
                <span class="stat-label">High</span>
                <span id="stat-high" class="stat-value price-locator" data-denomination="USD" data-locale="en-US"
                  data-style="currency" data-spacing="0" data-amount="0" data-setAmount=""
                  data-denomination-symbol="$"></span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Low</span>
                <span id="stat-low" class="stat-value price-locator" data-denomination="USD" data-locale="en-US"
                  data-style="currency" data-spacing="0" data-amount="0" data-setAmount="0"
                  data-denomination-symbol="$"></span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Exchange</span>
                <span id="stat-exchange" class="stat-value"></span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Prev Close</span>
                <span id="stat-prev-close" class="stat-value price-locator" data-denomination="USD" data-locale="en-US"
                  data-style="currency" data-spacing="0" data-amount="0" data-setAmount="0"
                  data-denomination-symbol="$"></span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Market Cap</span>
                <span id="stat-market-cap" class="stat-value"></span>
              </div>
            </div>
          </div>
          <div class="chart-toolbar">
            <div class="chart-mode-toggle">
              <button class="chart-mode-btn active" data-chart-mode="historical">Historical</button>
              <button class="chart-mode-btn" data-chart-mode="candlestick">Candlestick</button>
            </div>

            <div id="historical-controls" class="chart-controls">
              <button data-range="1W">1W</button>
              <button data-range="1M" class="active">1M</button>
              <button data-range="3M">3M</button>
              <button data-range="1Y">1Y</button>
              <button data-range="YTD">YTD</button>

              <button id="btn-custom-range">Custom</button>

              <div id="custom-range-controls" class="custom-range-controls invisible">
                <input type="date" id="chart-from-date">
                <input type="date" id="chart-to-date">
                <button id="btn-apply-custom-range">Apply</button>
              </div>
            </div>

            <div id="candlestick-controls" class="chart-controls invisible">
              <button data-interval="1min">1M</button>
              <button data-interval="5min" class="active">5M</button>
              <button data-interval="15min">15M</button>
              <button data-interval="30min">30M</button>
              <button data-interval="1hour">1H</button>
              <button data-interval="4hour">4H</button>
            </div>
          </div>

          <canvas id="stockChart"></canvas>
          <!-- Peers Panel -->
          <div id="stock-peers" class="sd-panel">
            <div class="sd-panel-header">
              <span class="sd-panel-title">Sector Peers</span>
            </div>
            <div id="peers-list"></div>
          </div>

        </div>
      </div>

      <!-- ── RIGHT COLUMN: News ───────────────────────────────── -->
      <div id="stock-news" class="sd-panel">
        <div class="sd-panel-header">
          <span class="sd-panel-title">Latest News</span>
        </div>
        <div id="news-list"></div>
      </div>

    </div>
  </main>
  <div class="portfolio-popup-container invisible">
  <div class="portfolio-popup">
    <h2 id="portfolio-popup-title">Buy Asset</h2>
      <div class="portfolio-popup-field">
        <label for="numShares"># of Shares</label>
        <input type="number" id="numShares" placeholder="e.g., 12345">
      </div>
      <div class="portfolio-popup-field">
        <label for="priceBought">Price per Share ($)</label>
        <input type="number" id="priceBought" placeholder="e.g., 123.45">
      </div>
      <div class="portfolio-popup-actions">
        <button class="btn btn-secondary" id="btn-close-portfolio">Cancel</button>
        <button class="btn btn-primary" id="btn-add-portfolio">Confirm</button>
      </div>
    </div>
  </div>
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-brand">Tradar</span>
<span class="footer-copy">&copy; 2026 Tradar</span>
    </div>
    <p class="footer-disclaimer">Market data is for informational purposes only and is not financial advice.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="../scripts/ui.js"></script>
  <script type="module" src="../scripts/pages/stock-details.js"></script>
</body>

</html>
